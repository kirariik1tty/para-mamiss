<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Mamãe ♡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-left">
      <button class="circle-button" id="profileButton" aria-label="Abrir perfil">♡</button>
      <button class="circle-button" id="addButton" aria-label="Adicionar">+</button>
    </div>

    <nav class="nav-menu">
      <a href="#inicio" class="active">Início</a>
      <a href="#memorias">Memórias</a>
      <a href="#mensagens">Mensagens</a>
    </nav>
  </header>

  <main id="inicio">

    <!-- HERO -->
    <section class="hero">
      <div class="hero-content">
        <span class="hero-small">PARA A MELHOR MÃE ♡</span>

        <h1>Feliz aniversário,<br>mãe.</h1>

        <p>
          Um pequeno cantinho feito especialmente para celebrar
          você e todas as memórias que construímos juntas.
        </p>

        <button class="read-more" id="readMoreButton">Ler mais →</button>

        <div class="slider-dots">
          <button class="dot active-dot" data-slide="0" aria-label="Slide 1"></button>
          <button class="dot" data-slide="1" aria-label="Slide 2"></button>
          <button class="dot" data-slide="2" aria-label="Slide 3"></button>
        </div>
      </div>

      <div class="hero-decoration">♡</div>

      <div class="hero-photo" id="heroPhoto">
        <img src="imagens/mamis.jpeg" alt="Uma foto especial da mamãe">
      </div>
    </section>

    <!-- GRID PRINCIPAL -->
    <section class="content-grid">

      <!-- MEMÓRIAS -->
      <section class="artwork-section" id="memorias">
        <div class="section-title">
          <h2>Memórias</h2>
          <button class="section-action" id="memoriesArrow" aria-label="Abrir memórias">→</button>
        </div>

        <div class="memory-grid">
          <button class="memory-card" data-memory="lembranca">
            <div class="memory-photo">
              <img src="imagens/eu%20i%20ela.jpeg" alt="Uma lembrança com a mamãe">
            </div>
            <div class="memory-info">
              <span>uma lembrança ₊⊹</span>
              <small>Clique para abrir</small>
            </div>
          </button>

          <button class="memory-card" data-memory="momento">
            <div class="memory-photo">
              <img src="imagens/fofos.jpeg" alt="Um momento especial com a mamãe">
            </div>
            <div class="memory-info">
              <span>um momento ⋆.˚</span>
              <small>Clique para abrir</small>
            </div>
          </button>
        </div>

        <div class="more-photos" id="morePhotos" hidden>
          <div class="photo-gallery">
            <img src="imagens/idk.jpeg" alt="Uma lembrança especial">
            <img src="imagens/noisss.jpeg" alt="Uma foto nossa">
            <img src="imagens/presente.jpeg" alt="Um momento especial">
            <img src="imagens/sla.jpeg" alt="Uma lembrança com a mamãe">
            <img src="imagens/uau.jpeg" alt="Uma memória especial">
          </div>
        </div>

        <button class="view-button" id="viewMoreButton">Ver mais</button>
      </section>

      <!-- CARTINHAS -->
      <section class="search-section" id="mensagens">
        <div class="section-title">
          <h2>Cartinhas</h2>
          <button class="section-action" id="messagesButton" aria-label="Abrir mensagens">×</button>
        </div>

        <div class="message-list">
          <button class="message" data-message="mensagem">
            <span>♡</span>
            <p>Uma mensagem para você</p>
          </button>

          <button class="message" data-message="admiracao">
            <span>♡</span>
            <p>Coisas que admiro em você</p>
          </button>

          <button class="message" data-message="memoria">
            <span>♡</span>
            <p>Uma memória especial</p>
          </button>

          <button class="message selected" data-message="amor">
            <span>♡</span>
            <p>Por que eu te amo</p>
          </button>

          <button class="message" data-message="saudade">
            <span>♡</span>
            <p>Para ler quando sentir saudade</p>
          </button>
        </div>
      </section>

      <!-- DESTAQUES -->
      <section class="ranking-section">
        <button class="ranking-card" data-feature="inspiracao">
          <div class="ranking-icon">☘︎</div>
          <div>
            <h3>Minha inspiração</h3>
            <p>A pessoa que mais me ensina todos os dias.</p>
          </div>
        </button>

        <button class="ranking-card" data-feature="porto">
          <div class="ranking-icon">ʚɞ</div>
          <div>
            <h3>Meu porto seguro</h3>
            <p>Meu local de acolhimento e cuidado.</p>
          </div>
        </button>

        <button class="ranking-card" data-feature="favorita">
          <div class="ranking-icon">𐙚</div>
          <div>
            <h3>Minha pessoa favorita</h3>
            <p>Minha paz e minha maior paixão.</p>
          </div>
        </button>
      </section>

    </section>

    <!-- AVATARES -->
    <section class="floating-cards">
      <div class="avatar-card">
        <button class="avatar-close" aria-label="Fechar">×</button>
        <div class="avatar" data-avatar="love">♡</div>
      </div>

      <div class="avatar-card">
        <button class="avatar-close" aria-label="Fechar">×</button>
        <div class="avatar" data-avatar="fact">✦</div>
      </div>
    </section>

  </main>

  <!-- MODAL GERAL (memórias, cartinhas, porto seguro, avatares) -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose" aria-label="Fechar">×</button>
      <span class="modal-decoration">♡</span>
      <img id="modalImage" class="modal-image" src="" alt="" hidden>
      <h2 id="modalTitle">Título</h2>
      <p id="modalText">Conteúdo</p>
      <button class="modal-action" id="modalAction">Continuar →</button>
    </div>
  </div>

  <!-- MODAL DO QUIZ -->
  <div class="modal" id="quizModal">
    <div class="modal-content">
      <button class="modal-close" id="quizModalClose" aria-label="Fechar">×</button>
      <span class="modal-decoration">♡</span>
      <div id="quizBody"></div>
    </div>
  </div>

  <!-- MODAL DA MÚSICA -->
  <div class="modal" id="musicModal">
    <div class="modal-content">
      <button class="modal-close" id="musicModalClose" aria-label="Fechar">×</button>
      <span class="modal-decoration">♪</span>
      <h2>Nossa música</h2>
      <p>Toda vez que essa música toca, penso em você.</p>
      <audio controls class="music-player">
        <source src="audio/nossa-musica.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
      </audio>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

</body>

</html>
